name: RDR2 Arabic — Pages and daily data
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: '10,25,40,55 * * * *'
permissions:
  contents: read
concurrency:
  group: rdr2-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - name: Restore complete original site package
        working-directory: .
        run: |
          python - <<'PYTHON'
          import pathlib, hashlib, io, zipfile
          parts = sorted(pathlib.Path('.').glob('site-package.part-*'))
          blob = b''.join(p.read_bytes() for p in parts)
          assert hashlib.sha256(blob).hexdigest() == "9e600824aeac34b1660100bea1594c755b85b7b96967d8820a660c4e7363dae2", 'Package checksum mismatch'
          with zipfile.ZipFile(io.BytesIO(blob)) as archive:
              for name in archive.namelist():
                  assert not pathlib.PurePosixPath(name).is_absolute() and '..' not in pathlib.PurePosixPath(name).parts
              archive.extractall('site')
          PYTHON
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Restore source and translation cache
        uses: actions/cache@v6
        with:
          path: site/.pages-cache
          key: rdr2-data-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: rdr2-data-v1-
      - name: Restore missing original source data without replacing originals
        working-directory: .
        run: |
          python - <<'PYTHON'
          import pathlib, zipfile, hashlib, shutil
          package=pathlib.Path('source-restoration-20261010.zip')
          expected=pathlib.Path('source-restoration.sha256').read_text().split()[0]
          assert hashlib.sha256(package.read_bytes()).hexdigest()==expected
          with zipfile.ZipFile(package) as archive:
              for name in archive.namelist():
                  assert not pathlib.PurePosixPath(name).is_absolute() and '..' not in pathlib.PurePosixPath(name).parts
                  target=pathlib.Path('site')/name
                  if target.exists():
                      backup=pathlib.Path('site/migration-backups/before-source-restoration')/name
                      backup.parent.mkdir(parents=True,exist_ok=True)
                      shutil.copy2(target,backup)
              archive.extractall('site')
          PYTHON
      - name: Apply preserved path corrections
        run: |
          cp ../pages-prepare-v3.mjs server/pages-prepare.mjs
          cp ../pages-verify.mjs server/pages-verify.mjs
          cp ../translation-bot-v2.mjs server/translation-bot.mjs
          cp ../translation-full-text.test.mjs server/translation-full-text.test.mjs
      - name: Verify full-text translation batching
        run: node --test server/translation-bot.test.mjs server/translation-full-text.test.mjs
      - name: Build original interface
        run: node server/pages-prepare.mjs
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - name: Refresh validated daily data and news
        run: node server/pages-export.mjs
      - name: Verify published routes and resources
        run: node server/pages-verify.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site/.pages-site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
